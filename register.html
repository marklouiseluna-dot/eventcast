<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — EventCast</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="homepage.html" class="nav-logo">🎫 EventCast</a>
            <div class="nav-links">
                <a href="homepage.html">Home</a>
                <a href="register.html" class="active">Register</a>
                <a href="homepage.html">Events</a>
                <a href="homepage.html">About</a>
            </div>
        </div>
    </nav>

    <!-- FORM -->
    <div class="container">
        <h1>EventCast</h1>
        <p class="tagline">Smart registration with weather advisory</p>

        <form id="eventForm">
            <label for="event">Event</label>
            <select id="event" name="event" required>
                <option value="">Choose an event</option>
                <!-- Options populated by JavaScript from events.js -->
            </select>

            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Auto-filled from event" readonly required>

            <label for="date">Event Date</label>
            <input type="date" id="date" name="date" readonly required>

            <div id="weather">
                <p>Select an event to see the forecast.</p>
            </div>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email (e.g., you@example.com)" required>

            <label for="guests">Number of Guests</label>
            <input type="number" id="guests" name="guests" min="1" required>

            <button type="submit" id="submitBtn">Submit</button>
        </form>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay">
        <div class="modal">
            <div class="success-badge">✅</div>
            <h2>Registration Successful</h2>
            <p id="confirmationMessage"></p>
            <div id="weatherAdvisory"></div>
            <button id="modalCloseButton">Close</button>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast"></div>

    <!-- SCRIPTS -->
    <script src="events.js"></script>
    <script src="script.js"></script>
</body>
</html>
